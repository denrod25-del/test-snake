# Daily use: docker compose up -d
# Data persists in ./data/water-leads.db — back up that folder.
services:
  aqualeads:
    build: .
    ports:
      - "${LISTEN_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/water-leads.db
      LISTEN_HOST: "0.0.0.0"
      AQUA_LEADS_RELOAD: "0"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
