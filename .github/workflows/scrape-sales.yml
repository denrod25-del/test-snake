name: Scrape Florida Tax Deed Sales

# Schedule: Mondays at 06:30 UTC (02:30 ET).
# Adjust frequency below; weekly is conservative and polite to county sites.
# To run on demand: Actions tab -> "Scrape Florida Tax Deed Sales" -> Run workflow.

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated list of counties (leave blank for all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements.txt'

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Run scraper
        working-directory: scraper
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            python scrape_sales.py --only "${{ github.event.inputs.only }}"
          else
            python scrape_sales.py
          fi

      - name: Rebuild static county SEO pages + stats manifest
        run: |
          python scripts/build_county_pages.py ${SITE_BASE_URL:+--base-url "$SITE_BASE_URL"}
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}

      - name: Commit updated sales.json + county pages
        run: |
          if [ -n "$(git status --porcelain sales.json counties data/counties sitemap.xml)" ]; then
            git config user.name  "tax-deed-bot"
            git config user.email "actions@users.noreply.github.com"
            git add sales.json counties data/counties sitemap.xml
            git commit -m "chore(data): refresh sales.json + county pages [skip ci]"
            git push
          else
            echo "No changes to sales.json / county pages"
          fi
