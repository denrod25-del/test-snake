name: Ingest Florida Water Quality

# Refreshes the normalized water-quality dataset in data/water/ from EPA
# Envirofacts (SDWIS inventory, violations, lead/copper) and UCMR 5 (PFAS).
#
# This runs in CI rather than locally because the ingest needs outbound access
# to data.epa.gov, which sandboxed development environments commonly block at
# the network-policy layer. A GitHub-hosted runner has open egress.
#
# Weekly on Thursdays at 09:00 UTC (05:00 ET), offset from the permit (07:30)
# and surplus (07:30 Tue) scrapes so they never contend. SDWIS is refreshed by
# states on a quarterly reporting cycle, so weekly is already generous; the
# schedule exists to catch new violations and newly published UCMR 5 batches.

on:
  schedule:
    - cron: '0 9 * * 4'

  # TEMPORARY — remove once this branch merges to the default branch.
  #
  # `workflow_dispatch` and `schedule` only fire for workflows that already
  # exist on the default branch, so until this merges there is no way to run
  # the first ingest. This push trigger is scoped to the feature branch so the
  # ingest can run and prove itself against real EPA data before merge.
  # It cannot loop: the commit this workflow makes carries [skip ci].
  push:
    branches:
      - claude/florida-water-quality-api-8pykvz
    paths:
      - 'water-quality/**'
      - '.github/workflows/ingest-water-quality.yml'

  workflow_dispatch:
    inputs:
      utility:
        description: 'Limit to one utility slug (e.g. "seacoast"). Blank = all configured.'
        required: false
        default: ''
      resolve:
        description: 'Re-resolve utility PWSIDs against SDWIS before ingesting'
        type: boolean
        required: false
        default: false
      no_cache:
        description: 'Bypass the local HTTP cache and refetch everything'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: ingest-water-quality
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: water-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'water-quality/requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Unit tests run before any network call. They are hermetic (synthetic
      # fixtures, fake transport), so a normalizer regression fails here rather
      # than quietly corrupting a committed dataset.
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Probe sources
        id: probe
        continue-on-error: true
        run: python -m fwq probe

      # Also runs unprompted when no lockfile exists: without resolved PWSIDs
      # the ingest has no focus systems and produces an inventory with no
      # results, violations, or profiles attached to anything.
      - name: Resolve utility PWSIDs
        if: inputs.resolve || hashFiles('water-quality/fwq/data/utilities.lock.json') == ''
        run: |
          python -m fwq resolve ${{ inputs.utility && format('--utility {0}', inputs.utility) || '' }}
          echo "::notice::Review the utilities.lock.json diff — a changed PWSID reassigns every record for that utility."

      - name: Ingest
        run: |
          python -m fwq ingest \
            ${{ inputs.utility && format('--utility {0}', inputs.utility) || '' }} \
            ${{ inputs.no_cache && '--no-cache' || '' }}

      - name: Validate published dataset
        run: python -m fwq validate

      # This suite builds its own synthetic dataset in a temp dir; it is a
      # regression check on the handler, not on what was just ingested.
      - name: Run API handler tests
        working-directory: .
        run: node water-quality/tests/api.test.mjs

      # ...so check the real dataset separately. Serving a manifest that claims
      # systems while the endpoints 404, or a lookup that returns nothing for a
      # populated ZIP, would be worse than publishing nothing.
      - name: Smoke-test the API against the ingested dataset
        working-directory: .
        run: |
          node -e '
          const { handler } = require("./netlify/functions/water-api.js");
          const get = (ep, q = {}) => handler({
            httpMethod: "GET", path: "/api/water/" + ep,
            queryStringParameters: q, rawQuery: new URLSearchParams(q).toString(),
            headers: { "x-nf-client-connection-ip": "ci" },
          });
          (async () => {
            const fail = (m) => { console.error("::error::" + m); process.exitCode = 1; };

            const health = JSON.parse((await get("health")).body);
            const systems = health.counts.systems;
            console.log(`status=${health.meta.status} systems=${systems} profiles=${health.counts.profiles}`);
            if (!systems) return fail("ingest produced no water systems");

            const list = await get("systems", { limit: "1" });
            if (list.statusCode !== 200) return fail(`/systems returned ${list.statusCode}`);
            const first = JSON.parse(list.body).systems[0];

            const one = await get("system", { pwsid: first.pwsid });
            if (one.statusCode !== 200) return fail(`/system?pwsid=${first.pwsid} returned ${one.statusCode}`);

            const zip = (first.serviceArea.zips || [])[0];
            if (zip) {
              const look = JSON.parse((await get("lookup", { zip })).body);
              if (!look.candidateCount) return fail(`lookup for ZIP ${zip} found nothing, but ${first.pwsid} reports serving it`);
              console.log(`lookup ${zip} -> ${look.candidateCount} candidate(s)`);
            }

            for (const p of health.counts.profiles ? JSON.parse((await get("utilities")).body).utilities : []) {
              if (p.pwsid) console.log(`profile: ${p.slug} -> ${p.pwsid}`);
            }
          })();'

      - name: Summarize
        if: always()
        working-directory: .
        run: |
          {
            echo "### Water quality ingest"
            echo
            if [ -f data/water/index.json ]; then
              python3 -c "
          import json
          m = json.load(open('data/water/index.json'))
          print('| field | value |'); print('|---|---|')
          print(f\"| status | \`{m['meta']['status']}\` |\")
          print(f\"| generated | {m['meta']['generatedAt']} |\")
          for k, v in m['counts'].items():
              print(f'| {k} | {v} |')
          print()
          bad = [s for s in m['sources'] if s['status'] in ('blocked', 'broken')]
          if bad:
              print('**Degraded sources**')
              print()
              for s in bad:
                  print(f\"- \`{s['source']}\` ({s['status']}): {s['detail']}\")
          "
            else
              echo "No dataset was written."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit refreshed dataset
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/water
          # These two are generated by the ingest and may not exist on a first
          # run or a probe-only run, so add them only if present.
          for generated in \
            water-quality/fwq/data/utilities.lock.json \
            water-quality/fwq/data/sdwis_contaminant_codes.json
          do
            [ -f "$generated" ] && git add "$generated"
          done
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh Florida water quality dataset [skip ci]"
          for attempt in 1 2 3 4; do
            if git push origin HEAD; then exit 0; fi
            echo "push failed, retrying in $((2 ** attempt))s"
            sleep $((2 ** attempt))
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || true
          done
          echo "::error::Could not push the refreshed dataset after 4 attempts."
          exit 1
