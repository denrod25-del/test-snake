# Two ways to deploy:
#
# 1. Vite app (recommended going forward) — uncomment the block below
#      [build]
#        base      = "app"
#        command   = "npm install && npm run build"
#        publish   = "app/dist"
#        functions = "../netlify/functions"
#
# 2. Legacy single-file site (the original tax-deeds.html) — current default.
#    The legacy site and the Vite app share the same Netlify Functions
#    (Stripe + Supabase) because the API URLs are stable.

[build]
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The Stripe webhook needs the raw body for signature verification.
# Netlify passes event.body as a string by default, which is what we want.
[functions."stripe-webhook"]
  included_files = []

# Weekly surplus refresh (Tuesdays 08:00 UTC) — uses Netlify SUPABASE_* env.
[functions."refresh-surplus"]
  schedule = "0 8 * * 2"

# Daily signal-alert digest (12:00 UTC) — uses RESEND_API_KEY + SUPABASE_* env.
# Cron must be on a separate function; Netlify blocks public HTTP on scheduled functions.
[functions."send-alert-digest-cron"]
  schedule = "0 12 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.stripe.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.stripe.com https://*.arcgis.com https://server.arcgisonline.com https://gisweb.miamidade.gov https://gisweb-adapters.bcpa.net https://gis.hcpafl.org https://www.ocgis.com https://egis.pinellas.gov https://maps.coj.net https://gis.manateepao.com https://maps.pascopa.com https://maps.co.palm-beach.fl.us https://gis.polk-county.net https://maps2.vcgov.org https://maps5.vcgov.org https://gis.baycountyfl.gov https://geoweb.martin.fl.us https://agis.charlottecountyfl.gov https://maps.hillsboroughcounty.org https://pascogis.pascocountyfl.net https://api.census.gov https://nominatim.openstreetmap.org https://msc.fema.gov https://hazards.fema.gov; frame-src https://js.stripe.com; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/tax-deeds.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# sales.json should never be cached — it's the live data feed
[[headers]]
  for = "/sales.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Pretty paths to functions
[[redirects]]
  from = "/api/checkout"
  to   = "/.netlify/functions/create-checkout-session"
  status = 200

[[redirects]]
  from = "/api/portal"
  to   = "/.netlify/functions/create-portal-session"
  status = 200

[[redirects]]
  from = "/api/stripe-webhook"
  to   = "/.netlify/functions/stripe-webhook"
  status = 200

[[redirects]]
  from = "/api/sync-subscription"
  to   = "/.netlify/functions/sync-subscription"
  status = 200

[[redirects]]
  from = "/api/refresh-surplus"
  to   = "/.netlify/functions/refresh-surplus"
  status = 200

# ── Pro-only data APIs ─────────────────────────────────────────────────────
# These functions verify the caller's Supabase JWT, confirm an active Pro
# subscription, deduct one credit, and proxy to the upstream vendor (BatchData
# or RentCast). They never run on free accounts.
[[redirects]]
  from = "/api/skip-trace"
  to   = "/.netlify/functions/skip-trace"
  status = 200

[[redirects]]
  from = "/api/avm-lookup"
  to   = "/.netlify/functions/avm-lookup"
  status = 200

[[redirects]]
  from = "/api/rent-lookup"
  to   = "/.netlify/functions/rent-lookup"
  status = 200

[[redirects]]
  from = "/api/credits"
  to   = "/.netlify/functions/credits-balance"
  status = 200

# Service Property Intelligence — shop API key auth (not Pro JWT)
[[redirects]]
  from = "/api/property"
  to   = "/.netlify/functions/property-briefing"
  status = 200

[[redirects]]
  from = "/property-intelligence"
  to   = "/property-intelligence.html"
  status = 200

