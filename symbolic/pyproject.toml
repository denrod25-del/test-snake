[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic"
version = "0.1.0"
description = "SYMBOLIC — a search company in a monorepo. Hybrid neural+symbolic ranker."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-dir]
"" = "packages"
