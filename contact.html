<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — DeedScout</title>
  <meta name="description" content="Contact DeedScout for pricing, partnerships, investor inquiries, and data questions." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/deedscout.css" />
</head>
<body class="ds-body">
<main class="ds-main" style="padding-top:48px;max-width:640px;">
  <div class="ds-section-head">
    <p class="ds-section-label">Contact</p>
    <h1>Get in touch</h1>
    <p>For legal, privacy, data, pricing, partnership, or investor inquiries — use the form below.</p>
  </div>

  <form class="ds-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" style="background:var(--ds-panel);border:1px solid var(--ds-border);border-radius:var(--ds-radius);padding:28px;">
    <input type="hidden" name="form-name" value="contact" />
    <p hidden><label>Don't fill: <input name="bot-field" /></label></p>
    <label style="color:var(--ds-ink-2);">Name<input type="text" name="name" required style="background:#fff;color:var(--ds-ink);border-color:var(--ds-border);" /></label>
    <label style="color:var(--ds-ink-2);">Email<input type="email" name="email" required style="background:#fff;color:var(--ds-ink);border-color:var(--ds-border);" /></label>
    <label style="color:var(--ds-ink-2);">Topic
      <select name="topic" required style="background:#fff;color:var(--ds-ink);border-color:var(--ds-border);">
        <option value="">Select…</option>
        <option>General question</option>
        <option>Pro / billing</option>
        <option>Investor Pro / Team plan</option>
        <option>Investor / partnership inquiry</option>
        <option>Legal or privacy</option>
        <option>Data correction</option>
      </select>
    </label>
    <label style="color:var(--ds-ink-2);">Message<textarea name="message" rows="5" required style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--ds-border);font-family:inherit;font-size:14px;"></textarea></label>
    <button type="submit" class="ds-btn ds-btn-primary" style="width:100%;">Send message</button>
  </form>

  <p style="margin-top:24px;font-size:14px;color:var(--ds-muted);">For legal, privacy, or data-related questions, contact the DeedScout team through this form. We respond within 2–3 business days.</p>
</main>
<script src="assets/deedscout.js"></script>
</body>
</html>
